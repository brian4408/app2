<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f1e9">
  <title>今天吃什麼？｜餐廳轉盤</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f4f1e9;
      --ink: #20251f;
      --muted: #72776d;
      --line: #dfded4;
      --green: #194c3b;
      --orange: #ed784b;
      --cream: #fffdf7;
      --shadow: 0 16px 45px rgba(37, 53, 39, .08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
    }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    .page { max-width: 1180px; padding: 28px 30px 48px; margin: 0 auto; }
    .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; }
    .brand { display: flex; gap: 10px; align-items: center; font-size: 14px; font-weight: 750; letter-spacing: .04em; }
    .brand-mark { display: grid; width: 34px; height: 34px; place-items: center; border-radius: 12px; background: var(--green); color: #f8f1de; font-size: 18px; }
    .save-note { font-size: 12px; color: var(--muted); display: flex; gap: 7px; align-items: center; }
    .save-dot { width: 7px; height: 7px; border-radius: 50%; background: #66a57c; }
    .account-area { display: flex; align-items: center; justify-content: flex-end; gap: 10px; flex-wrap: wrap; }
    .auth-status { color: var(--muted); font-size: 11px; min-height: 16px; text-align: right; }
    .google-btn, .signout-btn { border: 1px solid var(--line); border-radius: 999px; padding: 9px 13px; background: #fffdf7; color: var(--ink); font-size: 12px; font-weight: 700; }
    .google-btn { display: inline-flex; align-items: center; gap: 8px; }
    .google-btn:hover:not(:disabled), .signout-btn:hover { background: #f0eee5; }
    .google-btn:disabled { cursor: not-allowed; opacity: .55; }
    .google-g { font-weight: 900; font-size: 15px; color: #4285f4; }
    .account-user { display: none; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; }
    .account-user img { width: 28px; height: 28px; object-fit: cover; border-radius: 50%; background: #e8e6dc; }
    .auth-error { color: #a74232; font-size: 11px; max-width: 270px; text-align: right; }
    .retry-cloud { display: none; border: 0; padding: 3px 0; background: transparent; color: #194c3b; font-size: 11px; font-weight: 700; text-decoration: underline; }
    .intro { margin: 0 0 24px; }
    .eyebrow { color: var(--orange); font-size: 11px; text-transform: uppercase; letter-spacing: .16em; font-weight: 800; margin: 0 0 9px; }
    h1 { margin: 0; font-family: Georgia, "Noto Serif TC", serif; font-size: clamp(28px, 4vw, 42px); letter-spacing: -.04em; line-height: 1.15; }
    .subtitle { color: var(--muted); margin: 9px 0 0; font-size: 14px; }
    .layout { display: grid; grid-template-columns: minmax(0, 1.48fr) minmax(320px, .92fr); gap: 20px; align-items: start; }
    .card { background: var(--cream); border: 1px solid rgba(36, 48, 38, .07); border-radius: 22px; box-shadow: var(--shadow); }
    .wheel-card { padding: 22px 26px 24px; text-align: center; overflow: hidden; }
    .card-heading { display: flex; align-items: center; justify-content: space-between; text-align: left; gap: 10px; }
    .card-heading h2 { margin: 0; font-size: 15px; letter-spacing: .01em; }
    .count { color: var(--muted); font-size: 12px; }
    .wheel-stage { position: relative; width: min(100%, 440px); margin: 15px auto 16px; aspect-ratio: 1; }
    canvas { display: block; width: 100%; height: 100%; }
    .pointer { position: absolute; left: 50%; top: -2px; transform: translateX(-50%); z-index: 2; width: 27px; height: 32px; background: var(--orange); clip-path: polygon(0 0,100% 0,50% 100%); filter: drop-shadow(0 3px 2px #a3492d); }
    .spin-btn { display: inline-flex; justify-content: center; align-items: center; gap: 9px; min-width: 195px; border: 0; border-radius: 999px; padding: 14px 24px; background: var(--green); color: #fffdf7; font-weight: 750; box-shadow: 0 6px 0 #103729; transition: transform .15s, box-shadow .15s, opacity .15s; }
    .spin-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 0 #103729; }
    .spin-btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 3px 0 #103729; }
    .spin-btn:disabled { cursor: not-allowed; opacity: .45; box-shadow: none; }
    .empty-hint { display: none; color: var(--muted); font-size: 12px; margin: 12px 0 0; }
    .result { display: none; text-align: left; margin: 20px auto 0; max-width: 450px; border-radius: 15px; background: #f2f0e6; padding: 16px 18px; animation: pop .35s ease both; }
    .result.show { display: block; }
    @keyframes pop { from { opacity: 0; transform: translateY(7px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
    .result-kicker { color: #b35e3b; font-size: 10px; letter-spacing: .15em; font-weight: 800; margin-bottom: 5px; }
    .result-name { font-size: 21px; font-weight: 800; }
    .result-meta { color: var(--muted); font-size: 12px; margin-top: 5px; }
    .result-note { color: #555c51; font-size: 13px; margin-top: 10px; white-space: pre-wrap; }
    .result-actions { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 15px; }
    .quiet-btn { border: 0; background: transparent; color: var(--green); font-weight: 750; padding: 8px 0; }
    .quiet-btn:hover { text-decoration: underline; }
    .side { display: grid; gap: 16px; }
    .form-card, .list-card { padding: 20px; }
    .form-card h2, .list-card h2 { font-size: 15px; margin: 0; }
    .form-sub { color: var(--muted); font-size: 12px; margin: 5px 0 17px; }
    .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; }
    .field { display: grid; gap: 6px; }
    .field.full { grid-column: 1 / -1; }
    label { font-size: 11px; color: #646a60; font-weight: 700; }
    input, select, textarea { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 10px 11px; background: #fff; color: var(--ink); outline: none; font-size: 13px; transition: border-color .15s, box-shadow .15s; }
    input:focus, select:focus, textarea:focus { border-color: #7e9b86; box-shadow: 0 0 0 3px rgba(47, 112, 77, .1); }
    textarea { min-height: 62px; resize: vertical; }
    .add-btn { width: 100%; margin-top: 13px; border: 0; border-radius: 10px; padding: 11px; color: white; background: var(--orange); font-weight: 750; transition: filter .15s; }
    .add-btn:hover { filter: brightness(.95); }
    .add-btn:disabled { cursor: not-allowed; opacity: .45; }
    .list-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .list-actions { display: flex; gap: 12px; }
    .text-btn { border: 0; padding: 3px 0; color: #577260; background: none; font-size: 11px; font-weight: 700; }
    .text-btn:disabled { opacity: .35; cursor: default; }
    .restaurant-list { display: grid; gap: 8px; margin-top: 13px; max-height: 244px; overflow: auto; padding-right: 2px; }
    .restaurant-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 11px; border-radius: 11px; background: #f5f3ec; }
    .restaurant-item.used { opacity: .48; }
    .restaurant-main { min-width: 0; }
    .restaurant-name { font-size: 13px; font-weight: 750; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .restaurant-meta { color: var(--muted); font-size: 10px; margin-top: 3px; }
    .item-right { display: flex; align-items: center; gap: 7px; flex-shrink: 0; }
    .used-tag { color: #a45137; background: #f4e1d8; border-radius: 99px; font-size: 9px; padding: 4px 7px; }
    .delete-btn { border: 0; background: transparent; color: #92958e; font-size: 17px; line-height: 1; padding: 3px; }
    .delete-btn:hover { color: #b54838; }
    .empty-list { color: #878a81; font-size: 12px; text-align: center; padding: 22px 8px; border: 1px dashed #deddd3; border-radius: 11px; }
    .toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 14px); padding: 10px 15px; border-radius: 999px; color: white; background: #263f33; font-size: 12px; opacity: 0; pointer-events: none; transition: .2s; z-index: 5; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    @media (max-width: 790px) { .page { padding: 20px 16px 35px; } .layout { grid-template-columns: 1fr; } .wheel-card { padding: 19px 16px 22px; } .wheel-stage { width: min(100%, 390px); } .side { grid-template-columns: 1fr 1fr; align-items: start; } }
    @media (max-width: 560px) { .page { padding: 17px 12px 28px; } .topbar { margin-bottom: 22px; align-items: flex-start; gap: 12px; } .account-area { flex-direction: column; align-items: flex-end; gap: 6px; } .auth-status { display: none; } .save-note { font-size: 10px; } .side { grid-template-columns: 1fr; } .wheel-stage { width: min(100%, 340px); } .result-actions { align-items: flex-start; flex-direction: column; gap: 4px; } }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">✳</span><span>好好吃飯研究所</span></div>
      <div class="account-area">
        <div>
          <div class="auth-status" id="authStatus" aria-live="polite">Firebase 登入尚未設定</div>
          <div class="auth-error" id="authError" role="alert"></div>
          <button class="retry-cloud" id="retryCloud" type="button">重新載入雲端資料</button>
        </div>
        <button class="google-btn" id="googleSignIn" type="button" disabled><span class="google-g" aria-hidden="true">G</span>使用 Google 登入</button>
        <div class="account-user" id="accountUser"><img id="userPhoto" alt=""><span id="userName"></span><button class="signout-btn" id="signOut" type="button">登出</button></div>
      </div>
    </header>
    <section class="intro">
      <p class="eyebrow">A LITTLE HELP FOR YOUR NEXT MEAL</p>
      <h1>今天，吃點什麼？</h1>
      <p class="subtitle">把選擇交給轉盤，留點心思期待下一餐。</p>
    </section>

    <div class="layout">
      <section class="card wheel-card" aria-label="餐廳轉盤">
        <div class="card-heading"><h2>今日餐廳轉盤</h2><span class="count" id="wheelCount">0 間餐廳</span></div>
        <div class="wheel-stage">
          <div class="pointer" aria-hidden="true"></div>
          <canvas id="wheel" aria-label="餐廳選擇轉盤"></canvas>
        </div>
        <button id="spinBtn" class="spin-btn" disabled><span aria-hidden="true">↻</span> 開始抽選</button>
        <p class="empty-hint" id="emptyHint">先在右側新增幾間常去的店，轉盤就能開始囉。</p>
        <section class="result" id="result" aria-live="polite">
          <div class="result-kicker">今天就決定是這間！</div>
          <div class="result-name" id="resultName"></div>
          <div class="result-meta" id="resultMeta"></div>
          <div class="result-note" id="resultNote"></div>
          <div class="result-actions"><span class="count" id="remainingText"></span><button class="quiet-btn" id="spinAgain">再抽一家　↗</button></div>
        </section>
      </section>

      <aside class="side">
        <section class="card form-card">
          <h2>新增一家餐廳</h2>
          <p class="form-sub">把你想去的店收進轉盤裡</p>
          <form id="restaurantForm">
            <div class="fields">
              <div class="field full"><label for="name">餐廳名稱 <span aria-hidden="true">*</span></label><input id="name" name="name" maxlength="40" placeholder="例如：巷口的日式定食" required></div>
              <div class="field"><label for="cuisine">料理類型</label><select id="cuisine" name="cuisine"><option value="">先不分類</option><option>中式</option><option>日式</option><option>韓式</option><option>義式</option><option>美式</option><option>東南亞</option><option>咖啡／早午餐</option><option>其他</option></select></div>
              <div class="field"><label for="price">價位</label><select id="price" name="price"><option value="">先不設定</option><option value="$">平價 · $</option><option value="$$">中等 · $$</option><option value="$$$">稍高 · $$$</option></select></div>
              <div class="field full"><label for="area">區域（選填）</label><input id="area" name="area" maxlength="40" placeholder="例如：學校附近、台北車站"></div>
              <div class="field full"><label for="note">備註（選填）</label><textarea id="note" name="note" maxlength="160" placeholder="想記下的餐點、營業時間提醒⋯⋯"></textarea></div>
            </div>
            <button class="add-btn" type="submit">＋ 加入轉盤</button>
          </form>
        </section>

        <section class="card list-card">
          <div class="list-head">
            <h2>我的餐廳 <span id="listCount" class="count"></span></h2>
            <div class="list-actions"><button id="resetUsed" class="text-btn">重置略過</button><button id="clearAll" class="text-btn">清空</button></div>
          </div>
          <div class="restaurant-list" id="restaurantList"></div>
        </section>
      </aside>
    </div>
  </main>
  <div class="toast" id="toast" role="status"></div>

  <script type="module">
    // 1) 在 Firebase Console 建立 Web App，將該頁提供的設定貼在下方。
    // 2) Authentication > Sign-in method 啟用 Google，並在 Authorized domains 加入網站網域。
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js';
    import {
      GoogleAuthProvider,
      getRedirectResult,
      getAuth,
      onAuthStateChanged,
      signInWithPopup,
      signInWithRedirect,
      signOut
    } from 'https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js';
    import {
      doc,
      getDoc,
      getFirestore,
      onSnapshot,
      setDoc
    } from 'https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: 'AIzaSyDLYgKE6gmD9E7l7V_C1B5-3YKkjqwfAvc',
      authDomain: 'app-c8cce.firebaseapp.com',
      projectId: 'app-c8cce',
      storageBucket: 'app-c8cce.firebasestorage.app',
      messagingSenderId: '599472353938',
      appId: '1:599472353938:web:6810b1b88e89bcfc2fec4b'
    };
    const firebaseConfigured = Object.values(firebaseConfig).every(value =>
      typeof value === 'string' && value.length > 0 && !value.startsWith('YOUR_')
    );

    (() => {
      const STORAGE_KEY = 'meal-wheel-restaurants-v1';
      const GUEST_STORAGE_KEY = `${STORAGE_KEY}:guest`;
      const IMPORTED_STORAGE_KEY = `${STORAGE_KEY}:imported-to-cloud`;
      const COLORS = ['#194c3b', '#e9a34c', '#527d6d', '#e77950', '#d8bb80', '#326557', '#c9724f', '#8b9d75', '#d99a45', '#3b6955'];
      const $ = (id) => document.getElementById(id);
      const canvas = $('wheel');
      const ctx = canvas.getContext('2d');
      const spinBtn = $('spinBtn');
      let items = loadItems(GUEST_STORAGE_KEY);
      if (!items.length) items = loadItems(STORAGE_KEY); // 舊版 localStorage 資料
      let rotation = 0;
      let spinning = false;
      let toastTimer;
      let currentUid = null;
      let accountDataReady = false;
      let stopAccountListener = null;
      let accountLoadId = 0;
      let cloudWriteQueue = Promise.resolve();

      const signInButton = $('googleSignIn');
      const signOutButton = $('signOut');
      const accountUser = $('accountUser');
      const authStatus = $('authStatus');
      const authError = $('authError');
      let auth;
      let db;
      if (firebaseConfigured) {
        try {
          const app = initializeApp(firebaseConfig);
          auth = getAuth(app);
          db = getFirestore(app);
          const provider = new GoogleAuthProvider();
          provider.setCustomParameters({ prompt: 'select_account' });
          signInButton.disabled = false;
          authStatus.textContent = '資料已儲存在這台裝置';
          getRedirectResult(auth).catch(error => {
            authError.textContent = authErrorMessage(error);
          });
          onAuthStateChanged(auth, async user => {
            authError.textContent = '';
            signInButton.style.display = user ? 'none' : 'inline-flex';
            accountUser.style.display = user ? 'flex' : 'none';
            if (user) {
              $('userName').textContent = user.displayName || user.email || '已登入';
              $('userPhoto').src = user.photoURL || '';
              $('userPhoto').style.display = user.photoURL ? 'block' : 'none';
              authStatus.textContent = '正在載入雲端餐廳…';
            } else {
              authStatus.textContent = '尚未登入；資料儲存在這台裝置';
            }
            await switchAccount(user);
          });
          signInButton.addEventListener('click', async () => {
            authError.textContent = '';
            signInButton.disabled = true;
            try {
              const mobileBrowser = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
              if (mobileBrowser) await signInWithRedirect(auth, provider);
              else await signInWithPopup(auth, provider);
            }
            catch (error) { authError.textContent = authErrorMessage(error); }
            finally { signInButton.disabled = false; }
          });
          signOutButton.addEventListener('click', async () => {
            authError.textContent = '';
            try { await signOut(auth); }
            catch (error) { authError.textContent = authErrorMessage(error); }
          });
          $('retryCloud').addEventListener('click', () => {
            if (auth.currentUser) switchAccount(auth.currentUser);
          });
          window.addEventListener('online', () => {
            if (auth.currentUser) switchAccount(auth.currentUser);
          });
        } catch (error) {
          authStatus.textContent = 'Firebase 初始化失敗，請確認設定值';
          authError.textContent = error.message || '無法連接 Firebase';
        }
      } else {
        authStatus.textContent = '請先填入 Firebase Web App 設定';
      }

      function authErrorMessage(error) {
        const messages = {
          'auth/popup-closed-by-user': '登入視窗已關閉，尚未登入。',
          'auth/popup-blocked': '瀏覽器封鎖了登入視窗，請允許彈出式視窗後再試。',
          'auth/unauthorized-domain': '此網站網域尚未加入 Firebase 授權網域。',
          'auth/operation-not-allowed': 'Firebase 專案尚未啟用 Google 登入。',
          'auth/network-request-failed': '網路連線失敗，請稍後重試。'
        };
        return messages[error?.code] || `登入失敗：${error?.message || '請檢查 Firebase 設定。'}`;
      }

      function loadItems(key) {
        try {
          const parsed = JSON.parse(localStorage.getItem(key) || '[]');
          return Array.isArray(parsed) ? parsed.filter(x => x && typeof x.id === 'string' && typeof x.name === 'string') : [];
        } catch { return []; }
      }
      function cacheItems(key, value) {
        try { localStorage.setItem(key, JSON.stringify(value)); }
        catch (error) { console.warn('無法儲存本機快取', error); }
      }
      function persist() {
        const snapshot = items.map(item => ({ ...item }));
        const cacheKey = currentUid ? `${STORAGE_KEY}:user:${currentUid}` : GUEST_STORAGE_KEY;
        cacheItems(cacheKey, snapshot);
        if (!currentUid || !accountDataReady || !db) return;

        const uid = currentUid;
        const accountRef = doc(db, 'users', uid);
        cloudWriteQueue = cloudWriteQueue.catch(() => {}).then(() =>
          setDoc(accountRef, { restaurants: snapshot }, { merge: true })
        ).then(() => {
          if (currentUid === uid) authStatus.textContent = '已同步到你的 Google 帳戶';
        }).catch(error => {
          if (currentUid === uid) {
            authStatus.textContent = '雲端同步失敗';
            authError.textContent = firestoreErrorMessage(error);
          }
        });
      }
      async function switchAccount(user) {
        const loadId = ++accountLoadId;
        $('authError').textContent = '';
        $('retryCloud').style.display = 'none';
        if (stopAccountListener) stopAccountListener();
        stopAccountListener = null;
        currentUid = user?.uid || null;
        accountDataReady = false;

        if (!user) {
          items = loadItems(GUEST_STORAGE_KEY);
          if (!items.length) items = loadItems(STORAGE_KEY);
          $('authError').textContent = '';
          $('authStatus').textContent = firebaseConfigured ? '尚未登入；資料儲存在這台裝置' : '請先填入 Firebase Web App 設定';
          render();
          return;
        }

        $('authStatus').textContent = '正在載入雲端餐廳…';
        render();
        const accountRef = doc(db, 'users', user.uid);
        try {
          const accountSnapshot = await getDoc(accountRef);
          if (loadId !== accountLoadId) return;

          const cloudItems = accountSnapshot.data()?.restaurants;
          const alreadyImported = localStorage.getItem(IMPORTED_STORAGE_KEY) === 'true';
          const guestItems = loadItems(GUEST_STORAGE_KEY);
          const legacyItems = alreadyImported ? [] : (guestItems.length ? guestItems : loadItems(STORAGE_KEY));
          if ((Array.isArray(cloudItems) && cloudItems.length > 0) || alreadyImported || legacyItems.length === 0) {
            items = Array.isArray(cloudItems)
              ? cloudItems.filter(item => item && typeof item.id === 'string' && typeof item.name === 'string')
              : [];
          } else {
            // 首次登入時，將舊版本機清單匯入第一個登入帳戶一次。
            items = legacyItems;
            await setDoc(accountRef, { restaurants: items }, { merge: true });
            if (loadId !== accountLoadId) return;
            localStorage.setItem(IMPORTED_STORAGE_KEY, 'true');
          }

          accountDataReady = true;
          cacheItems(`${STORAGE_KEY}:user:${user.uid}`, items);
          render();
          $('authStatus').textContent = '已連線，正在同步…';
          stopAccountListener = onSnapshot(accountRef, snapshot => {
            if (loadId !== accountLoadId) return;
            const restaurants = snapshot.data()?.restaurants;
            if (!Array.isArray(restaurants)) return;
            items = restaurants.filter(item => item && typeof item.id === 'string' && typeof item.name === 'string');
            accountDataReady = true;
            cacheItems(`${STORAGE_KEY}:user:${user.uid}`, items);
            render();
            $('authStatus').textContent = '已同步到你的 Google 帳戶';
          }, error => {
            if (loadId !== accountLoadId) return;
            $('authStatus').textContent = '雲端同步失敗';
            $('authError').textContent = firestoreErrorMessage(error);
            $('retryCloud').style.display = 'inline-block';
          });
        } catch (error) {
          if (loadId !== accountLoadId) return;
          // Firestore may be temporarily offline. Keep the page usable with this account's local cache.
          // Writes still go through the Firestore SDK queue and can sync after connectivity returns.
          accountDataReady = true;
          $('authStatus').textContent = '雲端暫時離線；目前使用本機快取';
          $('authError').textContent = firestoreErrorMessage(error);
          $('retryCloud').style.display = 'inline-block';
          items = loadItems(`${STORAGE_KEY}:user:${user.uid}`);
          render();
          stopAccountListener = onSnapshot(doc(db, 'users', user.uid), snapshot => {
            if (loadId !== accountLoadId) return;
            const restaurants = snapshot.data()?.restaurants;
            if (!Array.isArray(restaurants)) return;
            items = restaurants.filter(item => item && typeof item.id === 'string' && typeof item.name === 'string');
            cacheItems(`${STORAGE_KEY}:user:${user.uid}`, items);
            render();
            $('authStatus').textContent = '已同步到你的 Google 帳戶';
            $('authError').textContent = '';
            $('retryCloud').style.display = 'none';
          }, listenerError => {
            if (loadId !== accountLoadId) return;
            $('authError').textContent = firestoreErrorMessage(listenerError);
            $('retryCloud').style.display = 'inline-block';
          });
        }
      }
      function firestoreErrorMessage(error) {
        const messages = {
          'permission-denied': 'Firestore 權限不足，請檢查資料庫安全規則。',
          'unavailable': 'Firestore 暫時無法連線，請檢查網路、資料庫是否已建立，以及瀏覽器是否封鎖連線。',
          'failed-precondition': 'Firestore 尚未完成設定，請確認資料庫與規則。',
          'not-found': '找不到 Firestore 資料庫，請確認建立的是 (default) 資料庫。'
        };
        console.error('Firestore request failed:', error);
        const reason = messages[error?.code] || error?.message || '請確認資料庫設定。';
        return `${reason}（${error?.code || 'unknown'}）`;
      }
      function text(s) { return String(s || '').trim(); }
      function priceLabel(v) { return v ? `${v} 價位` : ''; }
      function meta(item) { return [item.cuisine, item.area, priceLabel(item.price)].filter(Boolean).join(' · ') || '尚未填寫分類'; }
      function showToast(message) {
        const el = $('toast'); el.textContent = message; el.classList.add('show');
        clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 1900);
      }
      function resizeCanvas() {
        const rect = canvas.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        canvas.width = Math.round(rect.width * dpr); canvas.height = Math.round(rect.height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0); drawWheel();
      }
      function drawWheel() {
        const w = canvas.clientWidth, h = canvas.clientHeight;
        if (!w || !h) return;
        const cx = w / 2, cy = h / 2, radius = Math.min(w, h) / 2 - 7;
        ctx.clearRect(0, 0, w, h);
        ctx.save(); ctx.translate(cx, cy); ctx.rotate(rotation);
        if (!items.length) {
          ctx.beginPath(); ctx.arc(0, 0, radius, 0, Math.PI * 2); ctx.fillStyle = '#e8e6dc'; ctx.fill();
          ctx.strokeStyle = '#d5d4ca'; ctx.lineWidth = 2; ctx.stroke();
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#8b8d83';
          ctx.font = '700 17px system-ui, sans-serif'; ctx.fillText('等你加入第一家店', 0, -4);
          ctx.font = '12px system-ui, sans-serif'; ctx.fillText('新增餐廳，讓轉盤開始轉動', 0, 20);
        } else {
          const slice = Math.PI * 2 / items.length;
          items.forEach((item, i) => {
            const start = -Math.PI / 2 + i * slice, end = start + slice;
            ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, radius, start, end); ctx.closePath();
            ctx.fillStyle = COLORS[i % COLORS.length]; ctx.fill();
            ctx.strokeStyle = '#fffdf7'; ctx.lineWidth = 2; ctx.stroke();
            if (items.length > 1) {
              ctx.save(); ctx.rotate(start + slice / 2); ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
              ctx.fillStyle = '#fffdf7'; ctx.font = `700 ${Math.max(10, Math.min(14, 170 / items.length))}px system-ui, sans-serif`;
              let label = item.name;
              const maxChars = Math.max(5, Math.floor(radius * .55 / 14));
              if (label.length > maxChars) label = label.slice(0, maxChars - 1) + '…';
              ctx.fillText(label, radius - 17, 0, radius * .58); ctx.restore();
            }
          });
        }
        ctx.beginPath(); ctx.arc(0, 0, Math.max(24, radius * .14), 0, Math.PI * 2); ctx.fillStyle = '#fffdf7'; ctx.fill();
        ctx.strokeStyle = 'rgba(28,50,38,.14)'; ctx.lineWidth = 1; ctx.stroke();
        ctx.fillStyle = '#194c3b'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = '700 15px Georgia, serif'; ctx.fillText('吃', 0, 1);
        ctx.restore();
      }
      function render() {
        const available = items.filter(item => !item.used);
        const loadingCloud = Boolean(currentUid && !accountDataReady);
        $('wheelCount').textContent = `${items.length} 間餐廳`;
        $('listCount').textContent = `(${items.length})`;
        $('emptyHint').style.display = items.length ? 'none' : 'block';
        spinBtn.disabled = spinning || loadingCloud || available.length === 0;
        spinBtn.innerHTML = available.length ? '<span aria-hidden="true">↻</span> 開始抽選' : '<span aria-hidden="true">↻</span> 已全部抽過';
        $('resetUsed').disabled = loadingCloud || !items.some(item => item.used);
        $('clearAll').disabled = loadingCloud || items.length === 0;
        const addButton = document.querySelector('.add-btn');
        if (addButton) addButton.disabled = loadingCloud;
        $('restaurantList').innerHTML = items.length ? items.map(item => `
          <div class="restaurant-item ${item.used ? 'used' : ''}">
            <div class="restaurant-main"><div class="restaurant-name">${escapeHtml(item.name)}</div><div class="restaurant-meta">${escapeHtml(meta(item))}</div></div>
            <div class="item-right">${item.used ? '<span class="used-tag">已抽過</span>' : ''}<button class="delete-btn" data-delete="${escapeHtml(item.id)}" aria-label="刪除 ${escapeHtml(item.name)}" title="刪除">×</button></div>
          </div>`).join('') : '<div class="empty-list">還沒有餐廳，先新增一家喜歡的店吧。</div>';
        drawWheel();
      }
      function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch]);
      }
      function showResult(item) {
        $('resultName').textContent = item.name;
        $('resultMeta').textContent = meta(item);
        $('resultNote').textContent = item.note || '';
        $('resultNote').style.display = item.note ? 'block' : 'none';
        const left = items.filter(x => !x.used).length;
        $('remainingText').textContent = left ? `還有 ${left} 間尚未抽過` : '所有餐廳都抽過一輪了';
        $('spinAgain').textContent = left ? '再抽一家　↗' : '重置後再抽　↻';
        $('result').classList.add('show');
      }
      function spin() {
        const pool = items.filter(item => !item.used);
        if (spinning || !pool.length) return;
        spinning = true; $('result').classList.remove('show'); render();
        const chosen = pool[Math.floor(Math.random() * pool.length)];
        const chosenIndex = items.findIndex(item => item.id === chosen.id);
        const slice = Math.PI * 2 / items.length;
        const targetMod = (-(chosenIndex + .5) * slice) % (Math.PI * 2);
        let delta = targetMod - (rotation % (Math.PI * 2));
        if (delta < 0) delta += Math.PI * 2;
        const start = rotation, end = rotation + Math.PI * 2 * (5 + Math.floor(Math.random() * 3)) + delta;
        const duration = 3600, started = performance.now();
        function frame(now) {
          const t = Math.min(1, (now - started) / duration);
          const eased = 1 - Math.pow(1 - t, 4);
          rotation = start + (end - start) * eased; drawWheel();
          if (t < 1) requestAnimationFrame(frame);
          else {
            rotation = end % (Math.PI * 2); chosen.used = true; spinning = false; persist(); render(); showResult(chosen);
          }
        }
        requestAnimationFrame(frame);
      }
      $('restaurantForm').addEventListener('submit', event => {
        event.preventDefault();
        if (currentUid && !accountDataReady) return;
        const form = new FormData(event.currentTarget);
        const name = text(form.get('name'));
        if (!name) return;
        const item = { id: (crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`), name, cuisine: text(form.get('cuisine')), price: text(form.get('price')), area: text(form.get('area')), note: text(form.get('note')), used: false };
        items.push(item); persist(); event.currentTarget.reset(); $('result').classList.remove('show'); render(); $('name').focus(); showToast(`「${name}」已加入轉盤`);
      });
      $('restaurantList').addEventListener('click', event => {
        if (currentUid && !accountDataReady) return;
        const button = event.target.closest('[data-delete]'); if (!button) return;
        const item = items.find(x => x.id === button.dataset.delete);
        items = items.filter(x => x.id !== button.dataset.delete); persist(); render();
        if (item) showToast(`已移除「${item.name}」`);
      });
      spinBtn.addEventListener('click', spin); $('spinAgain').addEventListener('click', () => {
        if (!items.some(x => !x.used)) { resetUsed(); }
        $('result').classList.remove('show'); spin();
      });
      function resetUsed() { if (currentUid && !accountDataReady) return; items.forEach(item => item.used = false); persist(); render(); showToast('略過清單已重置，可以再抽一輪了'); }
      $('resetUsed').addEventListener('click', resetUsed);
      $('clearAll').addEventListener('click', () => {
        if (currentUid && !accountDataReady) return;
        if (!items.length) return;
        items = []; persist(); $('result').classList.remove('show'); render(); showToast('餐廳清單已清空');
      });
      window.addEventListener('resize', resizeCanvas);
      resizeCanvas(); render();
    })();
  </script>
</body>
</html>
